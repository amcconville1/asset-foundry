<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Review</title>
<style>
:root {
  --bg: #1c1d20; --panel: #25272b; --line: #34363b; --text: #e6e6e6; --dim: #9a9ca3;
  --like: #6cc070; --cut: #e06c62; --use: #e2b84a; --accent: #6aa7e8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button.on { border-color: var(--accent); color: var(--accent); }
select, input, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; resize: vertical; min-height: 70px; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--dim); }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
header .grow { flex: 1; }
.chip { padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); font-size: 12px; }
.chip.ready { color: var(--use); border-color: var(--use); }
.chip.reviewed { color: var(--like); border-color: var(--like); }
main { display: grid; grid-template-columns: 170px 1fr 330px; min-height: 0; }
.strip { overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.thumb { flex: none; position: relative; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--panel); cursor: pointer; }
.thumb.sel { border-color: var(--accent); }
.thumb img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.thumb .id { position: absolute; left: 6px; top: 4px; font-weight: 600; text-shadow: 0 1px 2px #000; }
.thumb .badge { position: absolute; right: 6px; top: 4px; font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 8px; background: #000a; }
.thumb.v-cut img { opacity: .35; }
.badge.like { color: var(--like); } .badge.cut { color: var(--cut); } .badge.use { color: var(--use); }
.thumb input { position: absolute; right: 6px; bottom: 6px; }
.stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.stage .tabs { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); align-items: center; }
.view { flex: 1; min-height: 0; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
.view canvas { display: block; width: 100%; height: 100%; }
.view img.sheet { max-width: 100%; max-height: 100%; }
.column { width: 100%; align-self: start; }
.hint { padding: 8px 8px 0; color: var(--dim); font-size: 13px; }
.compare { display: grid; gap: 8px; padding: 8px; width: 100%; align-self: start; }
.compare figure { margin: 0; background: var(--panel); border-radius: 8px; overflow: hidden; }
.compare figcaption { padding: 4px 8px; font-weight: 600; }
.compare .pair { display: grid; grid-template-columns: 1fr 1fr; }
.compare img { width: 100%; display: block; }
aside { border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
aside h2 { margin: 0; font-size: 18px; }
aside h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
.verdicts { display: flex; gap: 6px; }
.verdicts button { flex: 1; }
.verdicts .like.on { color: var(--like); border-color: var(--like); }
.verdicts .cut.on { color: var(--cut); border-color: var(--cut); }
.verdicts .use.on { color: var(--use); border-color: var(--use); }
.muted { color: var(--dim); }
.fail { color: var(--cut); }
.others div { margin-bottom: 4px; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.overlay polyline { fill: rgba(106, 167, 232, .15); stroke: var(--accent); stroke-width: 2; }
.label { position: absolute; left: 0; top: 0; background: #ff5d73; color: #fff; font-weight: 700; font-size: 12px;
  border-radius: 9px; padding: 0 6px; }
.mark { margin-top: 8px; }
.mark .del { float: right; padding: 0 6px; }
.mark textarea { min-height: 40px; margin-top: 4px; }
.empty { padding: 40px; color: var(--dim); text-align: center; }
.saved { font-size: 12px; color: var(--dim); min-height: 16px; }
.help { font-size: 12px; color: var(--dim); }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 50vh auto; }
  .strip { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .thumb { min-width: 110px; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
<script type="importmap">{"imports": {"three": "/static/vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="app">
  <header>
    <strong>Foundry review</strong>
    <select id="collection" aria-label="Collection"></select>
    <span id="rounds"></span>
    <span id="status" class="chip"></span>
    <span class="grow"></span>
    <label class="muted">Reviewer <input id="reviewer" size="10"></label>
    <button id="reviewed" title="Tell the agents this round is reviewed">Round reviewed</button>
  </header>
  <main>
    <div class="strip" id="strip"></div>
    <div class="stage">
      <div class="tabs">
        <button id="tab3d" class="on">3D <kbd>S</kbd></button>
        <button id="tabsheet">Sheet <kbd>S</kbd></button>
        <button id="tabcompare">Compare <kbd>V</kbd></button>
        <span class="grow"></span>
        <span class="help"><kbd>←</kbd><kbd>→</kbd> move · <kbd>L</kbd> like · <kbd>X</kbd> cut · <kbd>U</kbd> use · <kbd>0</kbd> clear · <kbd>C</kbd> comment · <kbd>Space</kbd> compare · <kbd>P</kbd> pin · <kbd>D</kbd> arrow · <kbd>A</kbd> lasso · <kbd>Z</kbd> undo</span>
      </div>
      <div class="view" id="view"></div>
    </div>
    <aside id="side"></aside>
  </main>
</div>
<script type="module" src="/static/review.js"></script>
</body>
</html>
